# Seed filters. Used only on first run if the Filters tab in the Google Sheet
# is empty. After that, edit filters via the GitHub Pages UI (which writes
# back to the Sheet) — this file is a fallback / initial bootstrap only.

filters:
  - role: "Cherry Picker / Cycle Count / Replenish"
    requirement: "Minimum 1 year cherry picker experience"
    job_hopping: "Average tenure > 1 year = positive, Multiple < 1 year roles = caution"
    active: true

  - role: "Data Entry Clerk / Desk Processor"
    requirement: "Minimum 1 year data entry AND Excel experience"
    job_hopping: "Average tenure > 1 year = positive, Multiple < 1 year roles = caution"
    active: true

  - role: "Packer / Labeler / Sorter / Receiver / Loader"
    requirement: "Minimum 1 year warehouse experience"
    job_hopping: "Average tenure > 1 year = positive, Multiple < 1 year roles = caution"
    active: true

  - role: "Will Call Clerk / Forklift Driver"
    requirement: "Minimum 1 year sit-down forklift (recent) experience"
    job_hopping: "Average tenure > 1 year = positive, Multiple < 1 year roles = caution"
    active: true
