name: Archive inbox before date

# One-time inbox cleanup. Manually triggered from the Actions tab.
# Takes a date (YYYY-MM-DD) and archives every thread currently in
# jobs@ INBOX whose latest message is on or before that date. Threads
# HR is actively working (any For HR/* label) are skipped by default.
#
# The default is a DRY RUN so you can confirm the count + sample
# subjects before any change happens. Re-run with dry_run=false to
# actually archive.
#
# Nothing is deleted -- threads stay in Gmail under All Mail and
# retain every other label they had. The action is reversible from the
# Gmail UI (search for the threads, click Move to inbox).

on:
  workflow_dispatch:
    inputs:
      archive_before_date:
        description: 'Archive threads with last message on or before this date (YYYY-MM-DD)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (just count + list; no archive). Uncheck to actually archive.'
        required: true
        type: boolean
        default: true
      skip_for_hr:
        description: 'Skip threads HR is actively working (any For HR/* label)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: archive-inbox
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Archive inbox before date
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          ARCHIVE_BEFORE_DATE: ${{ inputs.archive_before_date }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_FOR_HR: ${{ inputs.skip_for_hr }}
        run: python -m src.archive_before_date
