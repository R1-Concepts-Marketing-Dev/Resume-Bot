name: Migrate Candidates layout v2 (2026-06-18)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migrate-v2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run migration
        env:
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GMAIL_USER:                 ${{ secrets.GMAIL_USER }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          DRIVE_FOLDER_QUALIFIED:     ${{ secrets.DRIVE_FOLDER_QUALIFIED }}
          DRIVE_FOLDER_NOT_QUALIFIED: ${{ secrets.DRIVE_FOLDER_NOT_QUALIFIED }}
          DRIVE_FOLDER_REVIEW:        ${{ secrets.DRIVE_FOLDER_REVIEW }}
          DRIVE_FOLDER_PENDING:       ${{ secrets.DRIVE_FOLDER_PENDING }}
          DRIVE_FOLDER_INCOMING:      ${{ secrets.DRIVE_FOLDER_INCOMING }}
          SHEET_ID:                   ${{ secrets.SHEET_ID }}
        run: python -m src.migrate_v2
