name: Resume Bot canary

# Every-15-minute health check during business hours. Runs the
# deterministic checks in src/canary.py, writes results to the 'Bot
# Alerts' tab, and emails benw@r1concepts.com on any failure. Silent
# when everything is green -- no cron-email spam.
#
# GitHub Actions cron is UTC. PDT is UTC-7 (most of the year).
# Schedule: 8am - 5pm PT Mon-Fri = UTC 15-23 M-F plus UTC 00:XX for the
# 5pm PT slot (which lands on the next UTC day, so day-of-week 2-6).
# Accepts 1h drift twice a year around DST rather than DST-aware cron.
#
# Cadence: 4 checks/hour × ~9 hours × 5 days = ~180 runs/week. Each run
# is ~25 seconds, so ~75 min/week of Actions time = well under quota.

on:
  schedule:
    - cron: "*/15 15-23 * * 1-5"   # every 15 min, 8am-4:45pm PT, Mon-Fri
    - cron: "*/15 0 * * 2-6"        # every 15 min, 5-5:45pm PT close of biz
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run canary
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO || 'benw@r1concepts.com' }}
          # Auto-provided by GitHub. Used to query workflow run history
          # for the bot_run_health check. Read-only on this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.canary
