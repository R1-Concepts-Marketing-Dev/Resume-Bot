name: Resume Bot audit

# Weekly harvest of HR-vs-bot disagreements into Bot Learning Log.
# Runs Fri 4pm PT (23:00 UTC during PDT) so it catches the full week
# of HR activity. Each new entry becomes few-shot context for every
# bot scoring call the following week.
#
# Idempotent: reruns skip candidates already in the log.

on:
  schedule:
    - cron: "0 23 * * 5"   # Friday 4pm PT (PDT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run audit
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DASHBOARD_TAB_NAME: ${{ vars.DASHBOARD_TAB_NAME || 'Candidates' }}
          LEARNING_LOG_TAB_NAME: ${{ vars.LEARNING_LOG_TAB_NAME || 'Bot Learning Log' }}
        run: python -m src.audit
