# Bulk test corpus for the offline test scorer.
#
# Each test is one entry under `tests:`. The bulk scorer reads this file,
# runs every test against the current filters in filters.yaml, and prints
# a pass/fail summary in the GitHub Actions log.
#
# To add a new test:
#   1. Copy one of the existing entries.
#   2. Give it a unique `name`.
#   3. Set `expected_decision` to qualified | not_qualified | needs_review.
#      (Use needs_review for ambiguous or OCR-degraded resumes.)
#   4. Fill `email_subject` and `email_body` if the applicant mentioned a
#      specific role — leave empty otherwise.
#   5. Paste the resume text into `resume:` using the `|` block scalar
#      syntax (preserves line breaks).
#
# After adding tests, push to GitHub and trigger the
# "Bulk test scorer (offline)" workflow.

